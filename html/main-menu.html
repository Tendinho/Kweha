<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1024" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/app-icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/app-icon.svg" />
  <title data-i18n="menu.pageTitle">Kweha — Menu principal</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/menu-principal.css" />
</head>
<body>
  <main class="notebook-page">
    <div class="page menu-page">
      <header class="top-bar">
        <div class="user-status">
          <div class="user-avatar" id="user-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <use href="/assets/icons/sprite.svg#i-user"></use>
            </svg>
          </div>
          <div class="user-info">
            <span class="user-label" id="user-label" data-i18n="menu.userLabel">Jogador</span>
            <button class="user-button" id="user-button" type="button" data-i18n="common.enter" data-i18n-title="menu.userButtonTitle" title="Entrar ou alterar conta">ENTRAR</button>
          </div>
        </div>
      </header>

      <section class="menu-hero">
        <img class="menu-logo" src="/assets/images/kweha-logo.png" alt="Kweha" />
        <h1 class="menu-title" data-i18n="menu.hint">Escolhe o teu modo</h1>
      </section>

      <section class="game-modes" data-i18n-aria-label="menu.modesAria" aria-label="Modos de jogo">
        <button id="play-vs-computer" class="game-mode-btn computer-mode" type="button">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <use href="/assets/icons/sprite.svg#i-monitor"></use>
            </svg>
          </span>
          <span class="mode-title" data-i18n="menu.computerTitle">Com PC</span>
          <span class="mode-desc" data-i18n="menu.computerDesc">Rápido e sozinho. O computador responde contigo em cada ronda.</span>
          <span class="mode-cta">
            <span data-i18n="menu.computerCta">Jogar agora</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/assets/icons/sprite.svg#i-arrow-right"></use>
            </svg>
          </span>
        </button>

        <button id="play-multiplayer" class="game-mode-btn multiplayer-mode" type="button">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <use href="/assets/icons/sprite.svg#i-users"></use>
            </svg>
          </span>
          <span class="mode-title" data-i18n="menu.multiplayerTitle">Multiplayer</span>
          <span class="mode-desc" data-i18n="menu.multiplayerDesc">Joga online com até 4 jogadores. Cria uma sala ou entra com um código.</span>
          <span class="mode-cta">
            <span data-i18n="menu.multiplayerCta">Jogar online</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/assets/icons/sprite.svg#i-arrow-right"></use>
            </svg>
          </span>
        </button>
      </section>

      <section class="action-buttons">
        <button id="settings-btn" class="action-btn options-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <use href="/assets/icons/sprite.svg#i-settings"></use>
          </svg>
          <span data-i18n="menu.settings">Opções</span>
        </button>

        <button id="exit-btn" class="action-btn exit-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <use href="/assets/icons/sprite.svg#i-exit"></use>
          </svg>
          <span data-i18n="menu.exit">Sair</span>
        </button>
      </section>

    </div>
  </main>

  <script src="/js/storage.js?v=20261126a"></script>
  <script src="/js/i18n.js?v=20261126a"></script>
  <script src="/js/audio.js?v=20261126a"></script>
  <script src="/js/auth.js?v=20261126a"></script>
  <script src="/js/menu-principal.js?v=20261126a"></script>
</body>
</html>
