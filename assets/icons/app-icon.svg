<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset=".55" stop-color="#1b1350"/>
      <stop offset="1" stop-color="#3b0f63"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset=".5" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#ff2d78"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="118" cy="104" r="150" fill="#60a5fa" opacity=".16"/>
  <circle cx="430" cy="440" r="170" fill="#f472b6" opacity=".14"/>

  <rect x="52" y="52" width="408" height="408" rx="104" fill="none" stroke="url(#ring)" stroke-width="10" opacity=".75"/>
  <rect x="74" y="74" width="364" height="364" rx="86" fill="url(#glass)"/>

  <g fill="#ffffff" opacity=".16">
    <circle cx="150" cy="162" r="4"/>
    <circle cx="178" cy="162" r="4"/>
    <circle cx="206" cy="162" r="4"/>
    <circle cx="150" cy="190" r="4"/>
    <circle cx="178" cy="190" r="4"/>
    <circle cx="206" cy="190" r="4"/>
  </g>

  <text x="256" y="342" text-anchor="middle" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="250" font-weight="900" letter-spacing="-8" fill="url(#ink)" filter="url(#glow)">K</text>

  <path d="M116 388c44 24 88 36 140 36s96-12 140-36" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".28"/>
</svg>
